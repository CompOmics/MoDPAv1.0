name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels a run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is what env.yml pins; 3.11 is what the tests are developed against.
        python-version: ["3.10", "3.11"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run the test suite
        run: python -m pytest -v

      - name: Report skipped tests
        if: always()
        run: python -m pytest -q -rs

  compile:
    name: byte-compile every script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Most scripts in this repository have no tests. Byte-compiling them still
      # catches syntax errors, which is the failure a rename or a hand edit is
      # most likely to introduce. Compiling does not import, so the heavy
      # dependencies and the absent input files do not matter here.
      - name: py_compile all tracked Python files
        run: git ls-files '*.py' | xargs -r -n 50 python -m py_compile
